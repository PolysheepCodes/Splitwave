# Splitwave on nginx. Copy to /etc/nginx/sites-available/splitwave, change server_name, then:
#   sudo ln -s /etc/nginx/sites-available/splitwave /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d splitwave.example.com        # HTTPS (browsers require it outside localhost)
server {
    listen 80;
    listen [::]:80;
    server_name splitwave.example.com;

    root /srv/splitwave/web/dist;      # the built app (cd web && npm run build)
    index index.html;

    # Cross-origin isolation: browsers only let WebAssembly use several CPU threads on isolated pages.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # the 28 MB WebAssembly engine compresses to ~7 MB
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    location /assets/ {
        expires 1y;                    # names contain a content hash: cache forever
    }
    location = /index.html {
        expires -1;                    # always check for a new version
    }
    location / {
        try_files $uri $uri/ =404;
    }

    # Only if the models are on this server instead of Hugging Face (VITE_MODELS_URL empty in web/.env):
    # location /models/ {
    #     alias /srv/splitwave/models/;
    #     expires 1y;
    # }
    # location = /models/manifest.json {
    #     alias /srv/splitwave/models/manifest.json;
    #     expires -1;
    # }
}
